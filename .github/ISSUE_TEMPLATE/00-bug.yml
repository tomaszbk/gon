name: Bug report
description: Report a problem with Gon or its tools.
body:
  - type: input
    id: gon-version
    attributes:
      label: Gon version
      description: Paste the output of `gon version`. For editor issues, also include `gonpls version` and your editor version.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: e.g. macOS / arm64, Linux / amd64, or js / wasm
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What did you do?
      description: Include a small reproducible example and the commands you ran.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened instead?
      description: Include any error messages or relevant output.
    validations:
      required: true
