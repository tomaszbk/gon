name: container

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - src/**
      - tools/**
      - misc/gon/**
      - lib/**
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      REVISION: ${{ github.sha }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and execute legacy/modern pairs against Gon and upstream Go
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: gon:container-test
          build-args: GON_REVISION=${{ github.sha }}
      - name: Test installed toolchain and generated Linux executables
        run: python3 misc/gon/test_container.py gon:container-test
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          docker tag gon:container-test "$IMAGE:sha-$REVISION-$ARCH"
          docker push "$IMAGE:sha-$REVISION-$ARCH"

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform development and commit tags
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:dev" \
            --tag "$IMAGE:sha-$REVISION" \
            "$IMAGE:sha-$REVISION-amd64" \
            "$IMAGE:sha-$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$REVISION"

  release:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish stable tags for the release's tested image
        run: |
          [[ "$RELEASE_TAG" =~ ^v2\.27\.[0-9]+$ ]]
          REVISION="$(git rev-parse HEAD)"
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_TAG" \
            --tag "$IMAGE:2.27" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$REVISION"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
